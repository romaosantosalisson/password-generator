<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <script src="./src/main.js" defer></script>
  </head>
  <body>
    <div id="theme-toggle" class="theme">
      <i id="theme-icon" class="ph ph-sun"></i>
    </div>
    <h1>
      Generate a
      <br />
      <span>random password</span>
    </h1>
    <h4>Never use an insecure password again.</h4>
    <button id="generate-password">Generate passwords</button>
    <div class="passwords-area">
      <div class="first-password">
        <i id="first-password-copy" class="ph ph-copy"></i>
        <p id="first-password"></p>
      </div>
      <div class="second-password">
        <i id="second-password-copy" class="ph ph-copy"></i>
        <p id="second-password"></p>
      </div>
    </div>
    <footer></footer>
  </body>
</html>
